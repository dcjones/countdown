[project]
name = "countdown"
version = "0.1.0"
description = "Fast NMF for genomic count data"
authors = [
    {name = "Daniel C. Jones"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata (>=0.12.0,<0.33.0)",
    "torch (>=2.2.0)",
    "numpy (>=2.2.6,<3.0.0)",
    "scipy (>=1.15.3,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "scanpy>=1.12.2",
    "leidenalg>=0.12.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "scikit-learn>=1.9.0",
]
